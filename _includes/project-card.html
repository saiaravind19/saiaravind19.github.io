{% assign p = include.project %}
<article class="card project" data-tags="{{ p.tags | join: ',' | downcase }}">
  <a class="card-link" href="{{ p.url | relative_url }}" aria-label="{{ p.title | escape }}"></a>
  <div class="card-top">
    <span class="kicker">{{ p.kind | default: "Project" }}</span>
    {% if p.highlight %}<span class="badge">{{ p.highlight }}</span>{% endif %}
  </div>
  <h3>{{ p.title }}</h3>
  <p>{{ p.summary }}</p>
  <ul class="tags">{% for t in p.tags %}<li>{{ t }}</li>{% endfor %}</ul>
  <div class="card-actions">
    {% if p.repo %}<a href="{{ p.repo }}" class="chip">Code ↗</a>{% endif %}
    {% if p.demo %}<a href="{{ p.demo }}" class="chip">Demo ↗</a>{% endif %}
    <span class="chip chip-ghost">Details →</span>
  </div>
</article>
