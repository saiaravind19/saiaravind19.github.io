---
layout: default
---
<article class="wrap prose-wrap">
  <p class="crumb"><a href="{{ '/notes/' | relative_url }}">← All notes</a></p>
  <header class="page-head">
    <p class="eyebrow">{% if page.date %}{{ page.date | date: "%b %-d, %Y" }}{% else %}Note{% endif %}</p>
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="lede">{{ page.summary }}</p>{% endif %}
  </header>
  <div class="prose">{{ content }}</div>
</article>
